title: PowerShell Launched With Encoded Command
id: 7c263223-529c-4710-8d7c-219dbdfa1926
status: experimental
description: Detects powershell.exe started with -EncodedCommand, often used to hide malicious payloads.
author: MT (TinyBrother)
date: 2026-10-04
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: all of selection_*
falsepositives:
  - Some admin and deployment tools
level: high
