<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyBrother</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 16s5-9 14-9 14 9 14 9-5 9-14 9S2 16 2 16z' fill='%2314b8a6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230d1117'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 16s5-9 14-9 14 9 14 9-5 9-14 9S2 16 2 16z"/><circle cx="16" cy="16" r="5"/></svg>
      <div>
        <h1>TinyBrother</h1>
        <p id="subtitle">personal SOC · 127.0.0.1</p>
      </div>
    </div>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Time range" id="range">
        <button data-range="1h">1h</button>
        <button data-range="24h">24h</button>
        <button data-range="7d">7d</button>
        <button data-range="30d">30d</button>
        <button data-range="all">All</button>
      </div>
      <span class="live" id="live" title="Auto-refresh every 15 s"><span class="dot"></span><span id="live-text">live</span></span>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis" aria-label="Key figures"></section>

    <section class="grid two">
      <article class="card">
        <header><h2>Alerts over time</h2><span class="hint" id="bucket-hint"></span></header>
        <div class="legend" id="sev-legend"></div>
        <div class="chart" id="timeline"></div>
      </article>
      <article class="card">
        <header><h2>By severity</h2></header>
        <div id="severity"></div>
        <header class="sub"><h2>Top rules</h2></header>
        <div id="top-rules"></div>
      </article>
    </section>

    <article class="card">
      <header>
        <h2>MITRE ATT&amp;CK</h2>
        <span class="hint" id="attack-hint">Techniques covered by the loaded rules; colour = alerts in range. Click a technique to filter.</span>
      </header>
      <div class="attack-legend" id="attack-legend"></div>
      <div class="attack" id="attack"></div>
    </article>

    <article class="card">
      <header>
        <h2>Alerts</h2>
        <span class="hint" id="alerts-count"></span>
      </header>
      <div class="filters">
        <div class="chips" id="sev-filter"></div>
        <select id="status-filter" aria-label="Status">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="closed">Closed</option>
          <option value="false_positive">False positive</option>
        </select>
        <input id="search" type="search" placeholder="Search rule, command line, user…" aria-label="Search">
        <button class="ghost" id="clear-filters" hidden>Clear filters</button>
      </div>
      <div class="table-wrap">
        <table class="alerts">
          <thead><tr><th>Time</th><th>Severity</th><th>Rule</th><th>ATT&amp;CK</th><th>Source</th><th>Details</th><th>Status</th></tr></thead>
          <tbody id="alerts-body"></tbody>
        </table>
      </div>
      <div class="more"><button class="ghost" id="load-more" hidden>Load more</button></div>
    </article>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
      <button class="close" id="drawer-close" aria-label="Close">✕</button>
      <div id="drawer-content"></div>
    </div>
  </aside>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="/static/app.js"></script>
</body>
</html>
